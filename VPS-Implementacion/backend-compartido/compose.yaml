services:
  backend:
    image: "${APP_IMAGE:?Define una imagen versionada construida en tu computadora}"
    restart: unless-stopped
    init: true
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: vps
      SERVER_ADDRESS: "127.0.0.1"
      PORT: "18083"
      DB_URL: "${DB_URL:?Define la URL JDBC accesible desde el contenedor}"
      DB_USER: "${DB_USER:?Define el usuario de la base compartida}"
      DB_PASSWORD: "${DB_PASSWORD:?Define la contraseña de la base compartida}"
      JWT_SECRET: "${JWT_SECRET:?Define un secreto de firma exclusivo del VPS}"
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      PUBLIC_WEB_ORIGIN: "${PUBLIC_WEB_ORIGIN:-https://semillero.mandarina-group.cc}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      ANALYSIS_ENABLED: "${ANALYSIS_ENABLED:-false}"
      ANALYSIS_WORKER_ENABLED: "${ANALYSIS_WORKER_ENABLED:-false}"
      ANALYSIS_BASE_URL: "${ANALYSIS_BASE_URL:-}"
      ANALYSIS_TOKEN: "${ANALYSIS_TOKEN:-}"
      ANALYSIS_READ_JERSEYS: "${ANALYSIS_READ_JERSEYS:-true}"
      ANALYSIS_POLL_INTERVAL: "${ANALYSIS_POLL_INTERVAL:-5s}"
      ANALYSIS_CONNECT_TIMEOUT: "${ANALYSIS_CONNECT_TIMEOUT:-10s}"
      ANALYSIS_REQUEST_TIMEOUT: "${ANALYSIS_REQUEST_TIMEOUT:-2h}"
      ANALYSIS_MAX_DURATION: "${ANALYSIS_MAX_DURATION:-6h}"
      ANALYSIS_MAX_CONCURRENT_JOBS: "1"
      ANALYSIS_MAX_RESPONSE_BYTES: "${ANALYSIS_MAX_RESPONSE_BYTES:-16777216}"
      VIDEO_YOUTUBE_ENABLED: "${VIDEO_YOUTUBE_ENABLED:-false}"
      VIDEO_YOUTUBE_WORKER_ENABLED: "${VIDEO_YOUTUBE_WORKER_ENABLED:-false}"
      VIDEO_YOUTUBE_PYTHON: /opt/youtube/bin/python
      VIDEO_YOUTUBE_SCRIPT: /app/scripts/youtube_upload.py
      VIDEO_YOUTUBE_CLIENT: /var/lib/semillero/youtube/client_secret.json
      VIDEO_YOUTUBE_TOKENS: /var/lib/semillero/youtube/tokens.json
      VIDEO_YOUTUBE_CHANNEL: "${VIDEO_YOUTUBE_CHANNEL:-Semillero-Video-Analysis}"
      VIDEO_STORAGE_DIR: /var/lib/semillero/videos
      ANALYSIS_ARTIFACTS_DIR: /var/lib/semillero/analysis
      SPRING_SERVLET_MULTIPART_LOCATION: /var/lib/semillero/tmp/multipart
      JAVA_IO_TMPDIR: /var/lib/semillero/tmp/runtime
      TMPDIR: /var/lib/semillero/tmp/runtime
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0 -XX:+ExitOnOutOfMemoryError
    volumes:
      - backend_data:/var/lib/semillero
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: "${BACKEND_MEMORY_LIMIT:-1g}"
    cpus: "${BACKEND_CPUS:-1.0}"
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "--output", "/dev/null", "http://127.0.0.1:18083/api/v1/paises?size=1"]
      interval: 30s
      timeout: 6s
      start_period: 90s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_data:
