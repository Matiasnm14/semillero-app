spring.application.name=semillero
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/semillero}
spring.datasource.username=${DB_USER:semillero}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.data.web.pageable.max-page-size=100

spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never

# Multipart streams to disk rather than keeping match recordings in heap memory.
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.max-file-size=${VIDEO_MAX_FILE_SIZE:2GB}
spring.servlet.multipart.max-request-size=${VIDEO_MAX_REQUEST_SIZE:2049MB}
video.storage-dir=${VIDEO_STORAGE_DIR:.local/videos}
video.max-bytes=${VIDEO_MAX_BYTES:2147483648}
video.ffprobe=${VIDEO_FFPROBE:ffprobe}
video.ffmpeg=${VIDEO_FFMPEG:ffmpeg}
video.validation-timeout=${VIDEO_VALIDATION_TIMEOUT:1h}
video.youtube.enabled=${VIDEO_YOUTUBE_ENABLED:false}
video.youtube.python=${VIDEO_YOUTUBE_PYTHON:.local/youtube/venv/bin/python}
video.youtube.script=${VIDEO_YOUTUBE_SCRIPT:scripts/youtube_upload.py}
video.youtube.client=${VIDEO_YOUTUBE_CLIENT:.local/youtube/client_secret.json}
video.youtube.tokens=${VIDEO_YOUTUBE_TOKENS:.local/youtube/tokens.json}
video.youtube.channel=${VIDEO_YOUTUBE_CHANNEL:Semillero-Video-Analysis}
video.youtube.timeout=${VIDEO_YOUTUBE_TIMEOUT:1h}
