# Carga las credenciales locales al ejecutar desde IntelliJ o Maven en la raíz.
# Las variables del sistema siguen teniendo prioridad para otros entornos.
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=dev

spring.application.name=semillero
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/semillero}
spring.datasource.username=${DB_USER:semillero}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.baseline-version=-1
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
spring.flyway.fail-on-missing-locations=true
spring.sql.init.mode=never
spring.data.web.pageable.max-page-size=100

spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never

# Multipart streams to disk rather than keeping match recordings in heap memory.
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.max-file-size=${VIDEO_MAX_FILE_SIZE:2GB}
spring.servlet.multipart.max-request-size=${VIDEO_MAX_REQUEST_SIZE:2049MB}
video.storage-dir=${VIDEO_STORAGE_DIR:.local/videos}
video.max-bytes=${VIDEO_MAX_BYTES:2147483648}
video.ffprobe=${VIDEO_FFPROBE:ffprobe}
video.ffmpeg=${VIDEO_FFMPEG:ffmpeg}
video.validation-timeout=${VIDEO_VALIDATION_TIMEOUT:1h}
video.youtube.enabled=${VIDEO_YOUTUBE_ENABLED:false}
video.youtube.python=${VIDEO_YOUTUBE_PYTHON:.local/youtube/venv/bin/python}
video.youtube.script=${VIDEO_YOUTUBE_SCRIPT:scripts/youtube_upload.py}
video.youtube.client=${VIDEO_YOUTUBE_CLIENT:.local/youtube/client_secret.json}
video.youtube.tokens=${VIDEO_YOUTUBE_TOKENS:.local/youtube/tokens.json}
video.youtube.channel=${VIDEO_YOUTUBE_CHANNEL:Semillero-Video-Analysis}
video.youtube.timeout=${VIDEO_YOUTUBE_TIMEOUT:1h}

# HU02/HU03: enable after the Python service implements the documented contract.
analysis.enabled=${ANALYSIS_ENABLED:false}
analysis.worker-enabled=${ANALYSIS_WORKER_ENABLED:true}
analysis.base-url=${ANALYSIS_BASE_URL:}
analysis.evaluation-path=${ANALYSIS_EVALUATION_PATH:/internal/v1/evaluaciones}
analysis.token=${ANALYSIS_TOKEN:}
analysis.poll-interval=${ANALYSIS_POLL_INTERVAL:5s}
analysis.connect-timeout=${ANALYSIS_CONNECT_TIMEOUT:10s}
analysis.request-timeout=${ANALYSIS_REQUEST_TIMEOUT:2h}
analysis.lease-duration=${ANALYSIS_LEASE_DURATION:30s}
analysis.max-duration=${ANALYSIS_MAX_DURATION:6h}
analysis.max-concurrent-jobs=${ANALYSIS_MAX_CONCURRENT_JOBS:1}
analysis.max-response-bytes=${ANALYSIS_MAX_RESPONSE_BYTES:1048576}

# HU 16 (tarea S2-01): firma del JWT del login. En produccion va por JWT_SECRET,
# nunca en Git. El valor por defecto es solo para desarrollo local.
semillero.jwt.secret=${JWT_SECRET:semillero-dev-secret-cambiar-en-produccion}
semillero.jwt.duracion-minutos=${JWT_DURACION_MINUTOS:480}
