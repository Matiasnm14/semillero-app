# Primera entrega del VPS: API compartida sin inferencia ni publicación de videos.
# Credenciales explícitas; no usar los valores de desarrollo para este perfil.
spring.config.import=
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# El migrador central administra el esquema compartido; el runtime solo lo valida.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
server.address=127.0.0.1
server.port=18083
semillero.jwt.secret=${JWT_SECRET}

# El proxy termina HTTPS y conecta por HTTP local: permitir explícitamente el origen público.
# CORS_ALLOWED_ORIGINS agrega otros orígenes; vacío no elimina el de la web publicada.
semillero.cors.allowed-origin-patterns=${PUBLIC_WEB_ORIGIN:https://semillero.mandarina-group.cc},${CORS_ALLOWED_ORIGINS:}

# Disk-backed storage: bulk uploads and PNG must not use the read-only image or /tmp tmpfs.
video.storage-dir=${VIDEO_STORAGE_DIR:/var/lib/semillero/videos}
analysis.artifacts-dir=${ANALYSIS_ARTIFACTS_DIR:/var/lib/semillero/analysis}
spring.servlet.multipart.location=${SPRING_SERVLET_MULTIPART_LOCATION:/var/lib/semillero/tmp/multipart}

analysis.enabled=${ANALYSIS_ENABLED:false}
analysis.worker-enabled=${ANALYSIS_WORKER_ENABLED:false}
video.youtube.enabled=false
video.youtube.worker-enabled=false
