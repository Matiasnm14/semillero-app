# Primera entrega del VPS: API compartida sin inferencia ni publicación de videos.
# Credenciales explícitas; no usar los valores de desarrollo para este perfil.
spring.config.import=
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
semillero.jwt.secret=${JWT_SECRET}

# Vacío permite uso desde el mismo origen; indicar URLs exactas si la web usa otro origen.
semillero.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:}

# Disk-backed storage: bulk uploads and PNG must not use the read-only image or /tmp tmpfs.
video.storage-dir=${VIDEO_STORAGE_DIR:/var/lib/semillero/videos}
analysis.artifacts-dir=${ANALYSIS_ARTIFACTS_DIR:/var/lib/semillero/analysis}
spring.servlet.multipart.location=${SPRING_SERVLET_MULTIPART_LOCATION:/var/lib/semillero/tmp/multipart}

analysis.enabled=false
analysis.worker-enabled=false
video.youtube.enabled=false
video.youtube.worker-enabled=false
