services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-semillero}
      POSTGRES_USER: ${DB_USER:-semillero}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database:/opt/semillero/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
